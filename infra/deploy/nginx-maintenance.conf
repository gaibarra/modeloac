server {
    listen 80;
    listen [::]:80;
    server_name modeloac.online www.modeloac.online;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/modeloac-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://modeloac.online$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name modeloac.online www.modeloac.online;
    ssl_certificate /etc/letsencrypt/live/modeloac.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modeloac.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Retry-After 300 always;
    return 503 "Modelo AC: mantenimiento.\n";
}
