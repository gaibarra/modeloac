limit_req_zone $binary_remote_addr zone=modeloac_login:10m rate=10r/m;
server {
    listen 80;
    listen [::]:80;
    server_name modeloac.online www.modeloac.online;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/modeloac-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://modeloac.online$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.modeloac.online;
    ssl_certificate /etc/letsencrypt/live/modeloac.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modeloac.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://modeloac.online$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name modeloac.online;
    ssl_certificate /etc/letsencrypt/live/modeloac.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modeloac.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 5m;
    access_log /var/log/nginx/modeloac-access.log;
    error_log /var/log/nginx/modeloac-error.log;
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /api/login/ {
        limit_req zone=modeloac_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8188;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8188;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8188;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /django-static/ {
        proxy_pass http://127.0.0.1:8188;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3108;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
