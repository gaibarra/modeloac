server {
    listen 80;
    listen [::]:80;
    server_name modeloac.online www.modeloac.online;
    access_log /var/log/nginx/modeloac-access.log;
    error_log /var/log/nginx/modeloac-error.log;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/modeloac-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        add_header Retry-After 300 always;
        return 503 "Modelo AC: publicacion en preparacion.\n";
    }
}
